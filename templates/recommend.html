<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Satyam's Premium Library</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050505;
      --accent-gold: #e2b04a;
      --accent-neon: #00f5ff;
      --card-bg: rgba(20, 20, 20, 0.8);
      --text-main: #ffffff;
    }

    body {
      background-color: var(--bg-dark);
      /* Animated Mesh Gradient Background */
      background-image:
        radial-gradient(at 0% 0%, rgba(226, 176, 74, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 245, 255, 0.05) 0px, transparent 50%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Modern Minimal Navbar */
    .navbar {
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(20px);
      padding: 20px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .navbar-brand {
      font-family: 'Syncopate', sans-serif;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent-gold) !important;
      text-decoration: none;
    }

    .nav-link {
      color: #999 !important;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-left: 30px;
      transition: 0.4s;
    }

    .nav-link:hover {
      color: var(--accent-neon) !important;
    }

    .page-title {
      font-family: 'Syncopate', sans-serif;
      font-weight: 700;
      font-size: 3.5rem;
      text-align: center;
      margin: 80px 0 10px;
      background: linear-gradient(to bottom, #fff 30%, #666 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
    }

    .subtitle {
      text-align: center;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 0.8rem;
      margin-bottom: 60px;
      opacity: 0.8;
    }

    /* Form Styling */
    .search-container {
      max-width: 600px;
      margin: 0 auto 80px;
      text-align: center;
    }

    .form-control {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      border-radius: 0;
      padding: 15px;
    }

    .form-control:focus {
      background: rgba(255,255,255,0.08);
      border-color: var(--accent-neon);
      box-shadow: none;
      color: white;
    }

    .btn-recommend {
      background: var(--accent-gold);
      color: black;
      border-radius: 0;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 12px 40px;
      margin-top: 20px;
      border: none;
      transition: 0.3s;
    }

    .btn-recommend:hover {
      background: white;
      transform: scale(1.05);
    }

    .book-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.03);
      padding: 12px;
      height: 100%;
      position: relative;
      transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .book-card:hover {
      transform: translateY(-10px);
      background: rgba(30, 30, 30, 1);
    }

    .book-image {
      width: 100%;
      height: 380px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .book-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #eee;
      margin-bottom: 8px;
    }

    .book-author {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-gold);
    }

    footer {
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 60px 0;
      margin-top: 100px;
      text-align: center;
      color: #444;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('home') }}">S T Y M .</a>
    <div class="ms-auto">
      <a href="{{ url_for('home') }}" class="nav-link d-inline-block">Home</a>
      <a href="{{ url_for('index') }}" class="nav-link d-inline-block">TOP 50</a>
    </div>
  </div>
</nav>

  <div class="container">
    <h1 class="page-title">Recommendation</h1>
    <p class="subtitle">Essential Reading for the Modern Mind</p>

    <div class="search-container">
        <form action="/recommend_books" method="post">
          <input name="user_input" type="text" class="form-control" placeholder="Enter a book title..." required>
          <button type="submit" class="btn btn-recommend">Discover</button>
        </form>
    </div>

    <div class="row">
    {% if data %}
        {% for i in data %}
            <div class="col-md-3" style="margin-top: 50px">
                <div class="card">
                    <div class="card-body">
                        <img class="card-img-top" src="{{i[2]}}">
                        <p>{{i[0]}}</p>
                        <h4 class="text-white">{{i[1]}}</h4>
                    </div>
                </div>
            </div>
        {% endfor %}

    {% elif error %}
        <div class="col-12">
            <h4 class="text-center" style="color: white; margin-top: 50px;">{{ error }}</h4>
        </div>
    {% endif %}
</div>


  </div>

  <footer>
    <p>© 2026 SATYAM DESIGN STUDIO. ALL RIGHTS RESERVED.</p>
  </footer>

</body>
</html>
