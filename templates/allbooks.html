<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Library</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050505;
      --accent-gold: #e2b04a;
      --accent-neon: #00f5ff;
      --text-main: #ffffff;
      --card-bg: #0d0d0d;
    }

    body {
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(at 0% 0%, rgba(226,176,74,0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0,245,255,0.05) 0px, transparent 50%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
    }

    /* ---------- HEADER ---------- */
    .page-header {
      text-align: center;
      padding: 80px 20px 40px;
    }

    .brand-logo {
      font-family: 'Syncopate', sans-serif;
      font-weight: 700;
      font-size: 3.5rem;
      letter-spacing: 10px;
      background: linear-gradient(to bottom, #fff 40%, #444 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-subtitle {
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 5px;
      font-size: 0.8rem;
      opacity: 0.85;
      margin-top: 10px;
    }

    /* ---------- BOOK CARD ---------- */
    .book-card {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 18px;
      transition: all 0.4s ease;
      height: 100%;
    }

    .book-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 35px rgba(226,176,74,0.15);
      border-color: rgba(226,176,74,0.3);
    }

    .book-img {
      width: 100%;
      height: 240px;
      object-fit: contain;
      margin-bottom: 15px;
      background: #000;
      border-radius: 6px;
    }

    .book-title {
      font-weight: 700;
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .book-author {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-bottom: 6px;
    }

    .book-publisher {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-gold);
    }

    /* ---------- PAGINATION ---------- */
    .pagination .page-link {
      background: transparent;
      border: 1px solid rgba(226,176,74,0.35);
      color: var(--accent-gold);
      letter-spacing: 2px;
      margin: 0 4px;
    }

    .pagination .page-link:hover {
      background: var(--accent-gold);
      color: #000;
    }

    .pagination .active .page-link {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
      color: #000;
    }

    .pagination .disabled .page-link {
      opacity: 0.4;
    }

    /* ---------- FOOTER ---------- */
    .footer-minimal {
      text-align: center;
      margin: 60px 0 30px;
      font-size: 0.65rem;
      letter-spacing: 3px;
      color: #333;
      text-transform: uppercase;
    }

    /* Modern Minimal Navbar */
    .navbar {
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(20px);
      padding: 20px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .navbar-brand {
      font-family: 'Syncopate', sans-serif;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent-gold) !important;
      text-decoration: none;
    }

    .nav-link {
      color: #999 !important;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-left: 30px;
      transition: 0.4s;
    }

    .nav-link:hover {
      color: var(--accent-neon) !important;
    }
  </style>
</head>

<body>
  <!--  NAVBAR  -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('home') }}">BOOK BAY</a>
      <div class="ms-auto">
        <a href="{{ url_for('home') }}" class="nav-link d-inline-block">Home</a>
        <a href="{{ url_for('index') }}" class="nav-link d-inline-block">Top 50</a>
        <a href="{{ url_for('recommend_ui') }}" class="nav-link d-inline-block">Recommend</a>
        <a href="{{ url_for('all_books') }}" class="nav-link d-inline-block">Library</a>
      </div>
    </div>
  </nav>

  <!-- HEADER -->
  <div class="page-header">
    <h1 class="brand-logo">BOOK LIBRARY</h1>
    <p class="page-subtitle">Complete Collection</p>
  </div>

  <!-- Book Search Form -->
  <div class="container" style="margin-bottom: 30px;">
    <form method="POST" action="{{ url_for('search') }}" class="d-flex gap-2" style="max-width: 500px;">
      <input type="text" name="search_query" class="form-control" placeholder="Search for a book..." required style="background: rgba(255,255,255,0.08); border: 1px solid rgba(226,176,74,0.3); color: white;">
      <button type="submit" class="btn" style="background: rgba(226,176,74,0.9); color: #000; font-weight: 600; padding: 8px 24px;">Search</button>
    </form>
  </div>

  <!-- BOOK GRID -->
  <div class="container">
    <div class="row g-4">

      {% for book in data %}
      <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6">
        <div class="book-card">
          <img src="{{ book[2] }}" class="book-img" alt="{{ book[0] }}">
          <div class="book-title">{{ book[0] }}</div>
          <div class="book-author">{{ book[1] }}</div>
          <div class="book-publisher">{{ book[3] }}</div>
        </div>
      </div>
      {% endfor %}

    </div>

    <!-- PAGINATION -->
    <nav class="mt-5">
      <ul class="pagination justify-content-center">

        <li class="page-item {% if page == 1 %}disabled{% endif %}">
          <a class="page-link" href="{{ url_for('all_books', page=page-1) }}">Prev</a>
        </li>

        {% for p in range(start_page, end_page + 1) %}
        <li class="page-item {% if p == page %}active{% endif %}">
          <a class="page-link" href="{{ url_for('all_books', page=p) }}">{{ p }}</a>
        </li>
        {% endfor %}

        <li class="page-item {% if page == total_pages %}disabled{% endif %}">
          <a class="page-link" href="{{ url_for('all_books', page=page+1) }}">Next</a>
        </li>

      </ul>
    </nav>

  </div>

  <!-- FOOTER -->
  <div class="footer-minimal">
    © 2026 SATYAM DESIGN STUDIO
  </div>

</body>
</html>
