<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Satyam's Premium Library</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050505;
      --accent-gold: #e2b04a;
      --accent-neon: #00f5ff;
      --card-bg: rgba(20, 20, 20, 0.8);
      --text-main: #ffffff;
    }

    body {
      background-color: var(--bg-dark);
      /* Animated Mesh Gradient Background */
      background-image:
        radial-gradient(at 0% 0%, rgba(226, 176, 74, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 245, 255, 0.05) 0px, transparent 50%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Modern Minimal Navbar */
    .navbar {
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(20px);
      padding: 20px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .navbar-brand {
      font-family: 'Syncopate', sans-serif;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent-gold) !important;
      font-size: 1.2rem;
    }

    .nav-link {
      color: #999 !important;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-left: 30px;
      transition: 0.4s;
    }

    .nav-link:hover {
      color: var(--accent-neon) !important;
      text-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
    }

    /* Page Header */
    .page-title {
      font-family: 'Syncopate', sans-serif;
      font-weight: 700;
      font-size: 3.5rem;
      text-align: center;
      margin: 80px 0 10px;
      background: linear-gradient(to bottom, #fff 30%, #666 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
    }

    .subtitle {
      text-align: center;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 0.8rem;
      margin-bottom: 60px;
      opacity: 0.8;
    }

    /* The "Wow" Book Card */
    .book-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 0px; /* Minimalist Square Aesthetic */
      padding: 12px;
      height: 100%;
      position: relative;
      transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      overflow: hidden;
    }

    /* Hover Glow Effect */
    .book-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 1px solid var(--accent-gold);
      opacity: 0;
      transition: 0.5s;
      z-index: 1;
      pointer-events: none;
    }

    .book-card:hover {
      transform: translateY(-10px);
      background: rgba(30, 30, 30, 1);
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }

    .book-card:hover::before {
      opacity: 1;
      inset: 8px; /* Contract border on hover */
    }

    .book-image {
      width: 100%;
      height: 380px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
    }

    .book-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(30%);
      transition: 0.8s;
    }

    .book-card:hover .book-image img {
      filter: grayscale(0%);
      transform: scale(1.05);
    }

    /* Rating Overlay */
    .rating-circle {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: var(--bg-dark);
      border: 1px solid var(--accent-neon);
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--accent-neon);
      border-radius: 50%;
      z-index: 2;
    }

    .book-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #eee;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .book-author {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-gold);
      margin-bottom: 15px;
    }

    .book-stats {
      font-size: 0.7rem;
      color: #555;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
    }

    /* Footer */
    footer {
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 60px 0;
      margin-top: 100px;
      text-align: center;
      color: #444;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="#">S T Y M .</a>
      <div class="ms-auto d-none d-md-block">
        <a href="{{ url_for('index') }}" class="nav-link d-inline-block">Home Page</a>
        <a href="{{ url_for('recommend_ui') }}" class="nav-link d-inline-block">Recommend</a>
        <a href="{{url_for('all_books')}}" class="nav-link d-inline-block">BOOK LIBRARY</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <h1 class="page-title">TOP 50</h1>
    <p class="subtitle">Essential Reading for the Modern Mind</p>

    <div class="row g-4">
      {% for i in range(book_name|length) %}
        <div class="col-xl-3 col-lg-4 col-md-6">
          <div class="book-card">

            <div class="book-image">
              <div class="rating-circle">{{ "%.1f"|format(rating[i]) }}</div>
              <img src="{{ image[i] }}" alt="{{ book_name[i] }}">
            </div>

            <div class="book-title">{{ book_name[i] }}</div>
            <div class="book-author">{{ author[i] }}</div>

            <div class="book-stats">
              <span><i class="bi bi-chat-left-dots me-2"></i>{{ votes[i] }} VOTES</span>
              <span class="text-uppercase">Verified</span>
            </div>

          </div>
        </div>
      {% endfor %}
    </div>
  </div>

  <footer>
    <p>© 2026 SATYAM DESIGN STUDIO. ALL RIGHTS RESERVED.</p>
  </footer>

</body>
</html>
