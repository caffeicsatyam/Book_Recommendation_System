<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S T Y M | Premium Library</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050505;
      --accent-gold: #e2b04a;
      --accent-neon: #00f5ff;
      --text-main: #ffffff;
    }

    body {
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(at 0% 0%, rgba(226, 176, 74, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 245, 255, 0.05) 0px, transparent 50%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      overflow: hidden;
    }

    .hero-container {
      text-align: center;
      z-index: 2;
    }

    .brand-logo {
      font-family: 'Syncopate', sans-serif;
      font-weight: 700;
      font-size: 5.5rem;
      letter-spacing: 15px;
      margin-bottom: 10px;
      background: linear-gradient(to bottom, #fff 40%, #444 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: tracking-in-expand 1.5s cubic-bezier(0.215, 0.610, 0.355, 1.000) both;
    }

    .hero-subtitle {
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 6px;
      font-size: 0.85rem;
      margin-bottom: 50px;
      opacity: 0.8;
    }

    .btn-enter {
      position: relative;
      display: inline-block;
      padding: 18px 50px;
      color: var(--accent-gold);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 0.9rem;
      font-weight: 700;
      border: 1px solid rgba(226, 176, 74, 0.4);
      transition: 0.5s;
      background: transparent;
      overflow: hidden;
    }

    .btn-enter:hover {
      color: #000;
      background: var(--accent-gold);
      box-shadow: 0 0 40px rgba(226, 176, 74, 0.4);
      border-color: var(--accent-gold);
    }

    /* Subtle animation for the brand name */
    @keyframes tracking-in-expand {
      0% { letter-spacing: -0.5em; opacity: 0; }
      40% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .footer-minimal {
      position: absolute;
      bottom: 40px;
      font-size: 0.65rem;
      letter-spacing: 3px;
      color: #333;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <p class="hero-subtitle">Premium Book Intelligence</p>
    <h1 class="brand-logo">S T Y M</h1>
    <a href="/index" class="btn-enter">Explore Library</a>
  </div>

  <div class="footer-minimal">
    © 2026 SATYAM DESIGN STUDIO
  </div>

</body>
</html>
